<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Confirmação de cadastro – Duany Schenkel | Advogada de Direito Digital."
    >

    <title>Cadastro realizado | Duany Schenkel</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =====================================================
           PÁGINA DE CONFIRMAÇÃO
        ====================================================== */

        .confirmation-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            background: #F3EEE8;
        }

        .confirmation-content {
            width: 100%;
            max-width: 720px;
            text-align: center;
        }

        .confirmation-content .eyebrow {
            margin-bottom: 24px;
        }

        .confirmation-content h1 {
            margin: 0 0 28px;
            color: #3F2E2E;
        }

        .confirmation-content h1 em {
            color: #9C5A3C;
        }

        .confirmation-text {
            max-width: 580px;
            margin: 0 auto 18px;
            font-size: 18px;
            line-height: 1.7;
            color: #3F2E2E;
        }

        .confirmation-note {
            max-width: 520px;
            margin: 0 auto 36px;
            font-size: 14px;
            line-height: 1.6;
            color: #6F625C;
        }

        .confirmation-link {
            display: inline-block;
            color: #9C5A3C;
        }

        @media (max-width: 600px) {

            .confirmation-page {
                padding: 40px 20px;
            }

            .confirmation-content h1 {
                font-size: 42px;
                line-height: 1.1;
            }

            .confirmation-text {
                font-size: 16px;
            }

        }

    </style>

</head>


<body>

    <main class="confirmation-page">

        <div class="confirmation-content">

            <p class="eyebrow">
                CADASTRO REALIZADO
            </p>

            <h1>
                Obrigada por<br>
                <em>se inscrever.</em>
            </h1>

            <p class="confirmation-text">
                Seu cadastro foi realizado com sucesso.
                A partir de agora, você poderá receber conteúdos
                sobre Direito Digital, redes sociais e plataformas digitais.
            </p>

            <p class="confirmation-note">
                Você pode cancelar sua inscrição a qualquer momento.
            </p>

            <a
                href="index.html"
                class="text-link confirmation-link"
            >
                Voltar para o site →
            </a>

        </div>

    </main>

</body>

</html>
